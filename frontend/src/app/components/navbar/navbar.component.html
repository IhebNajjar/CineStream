<header class="navbar">
  <div class="container navbar-content">
    <a routerLink="/" class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
          <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/>
        </svg>
      </div>
      <span class="logo-text">Cine<span>Stream</span></span>
    </a>

    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
        Catalogue
      </a>
      <a routerLink="/" [queryParams]="{type: 'FILM'}" class="nav-link">
        Films
      </a>
      <a routerLink="/" [queryParams]="{type: 'SERIE'}" class="nav-link">
        Séries
      </a>
    </nav>

    <div class="navbar-right">
      <div class="visitor-badge" title="Sprint 1 - Catalogue public">
        <span class="visitor-dot"></span>
        <span>Visiteur</span>
      </div>
      <button class="btn-disabled" title="Disponible au Sprint 2" disabled>
        Connexion
      </button>
    </div>
  </div>
</header>
