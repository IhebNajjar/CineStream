<header class="navbar">
  <div class="container navbar-content">
    <div class="navbar-left">
      <a routerLink="/" class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
            <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/>
          </svg>
        </div>
        <span class="logo-text">CINE<span>STREAM</span></span>
      </a>

      <nav class="nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
          Accueil
        </a>
        <a routerLink="/" [queryParams]="{type: 'FILM'}" routerLinkActive="active" class="nav-link">
          Films
        </a>
        <a routerLink="/" [queryParams]="{type: 'SERIE'}" routerLinkActive="active" class="nav-link">
          Séries
        </a>
        <a routerLink="/" [queryParams]="{genre: 1}" class="nav-link">
          Action
        </a>
        <a routerLink="/" [queryParams]="{genre: 2}" class="nav-link">
          Science-Fiction
        </a>
      </nav>
    </div>

    <div class="navbar-right">
      <div class="user-actions">
        <button type="button" class="btn-login" (click)="showAuthAlert('Connexion')">
          Connexion
        </button>
        <button type="button" class="btn-signup" (click)="showAuthAlert('Inscription')">
          S'inscrire
        </button>
      </div>
    </div>
  </div>
</header>
