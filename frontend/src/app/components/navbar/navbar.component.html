<header class="navbar">
  <div class="container navbar-content">
    <div class="navbar-left">
      <a routerLink="/" class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
            <path d="M4 4h4v16H4V4zm6 0h4v16h-4V4zm6 0h4v16h-4V4z"/>
          </svg>
        </div>
        <span class="logo-text">Cine<span class="logo-accent">Stream</span><span class="logo-dot"></span></span>
      </a>

      <nav class="nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
          <span>Accueil</span>
        </a>
        <a routerLink="/films" routerLinkActive="active" class="nav-link">
          <span>Films</span>
        </a>
        <a routerLink="/series" routerLinkActive="active" class="nav-link">
          <span>Séries</span>
        </a>
      </nav>
    </div>

    <div class="navbar-right">
      <div class="navbar-actions">
        <!-- Direct Quick Search Icon link to Films page -->
        <a routerLink="/films" class="icon-btn" title="Rechercher des films">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="19" height="19">
            <circle cx="11" cy="11" r="8"/>
            <path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
          </svg>
        </a>

        <!-- Notification button with indicator dot -->
        <button type="button" class="icon-btn" title="Notifications" (click)="showAuthAlert('Notifications')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="19" height="19">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="notif-badge"></span>
        </button>

        <div class="user-actions">
          <button type="button" class="btn-login" (click)="showAuthAlert('Connexion')">
            Connexion
          </button>
          <button type="button" class="btn-signup" (click)="showAuthAlert('Inscription')">
            S'inscrire
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
