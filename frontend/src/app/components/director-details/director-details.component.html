<div class="director-page-container">
  <!-- Loading state -->
  <div *ngIf="loading()" class="loading-state">
    <div class="spinner"></div>
    <p>Chargement du profil...</p>
  </div>

  <!-- Error state -->
  <div *ngIf="error()" class="error-state">
    <div class="error-card">
      <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
      <h2>{{ error() }}</h2>
      <a routerLink="/films" class="btn-back">Retour au catalogue</a>
    </div>
  </div>

  <!-- Content -->
  <div *ngIf="!loading() && director()" class="director-content">
    <div class="director-header-card">
      <div class="director-photo-wrapper">
        <img [src]="director()?.photoUrl || '/assets/people/director_1.jpg'" [alt]="director()?.name" class="director-photo" />
      </div>

      <div class="director-info">
        <div class="tag-badge">Réalisateur / Réalisatrice</div>
        <h1 class="director-name">{{ director()?.name }}</h1>
        <p class="director-bio">{{ director()?.bio || 'Biographie à venir.' }}</p>
      </div>
    </div>

    <!-- Filmography section -->
    <div class="filmography-section">
      <div class="section-title-wrap">
        <h2 class="section-title">Œuvres Réalisées</h2>
        <span class="count-pill">{{ director()?.filmography?.length || 0 }} titres</span>
      </div>

      <div class="media-grid">
        <app-media-card *ngFor="let m of director()?.filmography" [media]="m"></app-media-card>
      </div>
    </div>
  </div>
</div>
