# CineStream Spring Boot Configuration
server.port=8080

# Spring Datasource Configuration (MySQL via XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/cinestream_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JSON Formatting
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=UTC

# Logging
logging.level.com.cinestream=INFO
logging.level.org.springframework.web=INFO
