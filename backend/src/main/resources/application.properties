# CineStream Spring Boot Configuration
server.port=8080

# Spring Datasource Configuration (MySQL via XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/cinestream_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JSON Formatting
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=UTC

# Logging
logging.level.com.cinestream=INFO
logging.level.org.springframework.web=INFO

# Cloudflare R2 Configuration (S3-compatible, kept in backend config only)
cloudflare.r2.account-id=${R2_ACCOUNT_ID:eeaf208ccf98e59a4a65615caae7486c}
cloudflare.r2.access-key-id=${R2_ACCESS_KEY_ID:4efcc60885973f309a5de63a07810287}
cloudflare.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:8d52764bc2593be6338cb26f4212f6fc187020c8163e471410f668024f1ba8c3}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME:cinestream-videos}
cloudflare.r2.endpoint=${R2_ENDPOINT:https://eeaf208ccf98e59a4a65615caae7486c.r2.cloudflarestorage.com}

# JWT Configuration (Stateless session)
app.jwt.secret=cinestream_super_secret_jwt_key_dsi31_2026_very_long_secure_key_123456789
app.jwt.expiration-ms=86400000
